packages:
  - context-store
  - contracts
  - identity
  - zkp
  - zkp/contract
  - zkp/sdk
  - demo
  - demo/apps/*
  - demo/packages/*
allowBuilds:
  better-sqlite3: true
  cbor-extract: false
  classic-level: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: true
  protobufjs: false
overrides:
  # Midnight's support matrix pairs midnight-js 4.1.1 and compact-runtime 0.16.0
  # with on-chain runtime 3.0.0. compact-runtime's range (^3.0.0) otherwise
  # resolves to 3.1.2 beside midnight-js's pinned 3.0.0, and a StateValue from
  # one copy fails the other's class check on every circuit call (#111).
  # Paired with midnight-js 4.1.1 and compact-runtime 0.16.0: re-check the
  # matrix and this pin whenever either of those moves.
  "@midnight-ntwrk/onchain-runtime-v3": 3.0.0
