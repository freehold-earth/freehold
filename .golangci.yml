version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - tagliatelle
    - tagalign
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/freehold-earth/freehold)
        - blank
        - dot
        - localmodule
    golines:
      max-len: 120

issues:
  # Local runs apply fixes. CI passes --fix=false so it fails instead.
  fix: true

output:
  formats:
    text:
      path: stderr
  sort-order:
    - severity
    - file
    - linter

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
