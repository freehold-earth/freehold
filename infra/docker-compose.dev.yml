# Development overrides - use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  context-store:
    build:
      context: ..
      dockerfile: context-store/Dockerfile
      target: builder
    volumes:
      - ../context-store/src:/app/context-store/src:ro
      - context-data:/app/data
    environment:
      - NODE_ENV=development
    command: pnpm dev

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
      target: builder
    volumes:
      - ../agent/src:/app/agent/src:ro
      - ${MODEL_PATH:-./models}:/app/models:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: python -m pci_agent --reload

  zkp:
    build:
      context: ..
      dockerfile: zkp/Dockerfile
      target: builder
    volumes:
      - ../zkp/sdk/src:/app/zkp/sdk/src:ro
    environment:
      - NODE_ENV=development
    command: pnpm dev
