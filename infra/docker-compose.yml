services:
  # ===========================================
  # Layer 1: Context Store
  # ===========================================
  context-store:
    build:
      context: ..
      dockerfile: context-store/Dockerfile
    ports:
      # Loopback only: other services reach it as context-store:8081 on the network.
      # Docker-published ports bypass ufw/firewalld, so exposure is decided here.
      - "127.0.0.1:8081:8081"
    volumes:
      - context-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8081
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      # node, not wget: the runtime image ships no wget, and node's fetch
      # handles the service listening on IPv6 localhost.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freehold-network

  # ===========================================
  # Layer 2: Personal Agent
  # ===========================================
  # Default LLM runtime (ADR-006): llama-server from llama.cpp serves one GGUF
  # file over the chat-completions API and makes no outbound calls. The agent
  # reaches it as https://llama-server:8080 inside the network, under the
  # certificate setup.sh generates; the published host port is for local tools
  # and avoids 8080, which FREEHOLD_CARDANO_URL uses. The service is on the
  # "llm" profile, which example.env enables by default (COMPOSE_PROFILES=llm).
  # For Ollama on the host, set COMPOSE_PROFILES=, FREEHOLD_LLM_BACKEND=ollama
  # and FREEHOLD_LLM_URL to a TLS proxy in front of it; the agent then starts
  # without this service.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-b12063
    profiles:
      - llm
    command:
      - "-m"
      - "/models/${MODEL_FILE:-Phi-3-mini-4k-instruct-q4.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLM_CONTEXT_LENGTH:-4096}"
      # No slots endpoint: it would expose in-flight prompts to anything on the network
      - "--no-slots"
      # No web UI: the agent is the only client
      - "--no-webui"
      # Bearer token required on every request; setup.sh generates the file and
      # puts the same value in FREEHOLD_LLM_API_KEY for the agent
      - "--api-key-file"
      - "/run/secrets/llama_api_key"
      # TLS with the certificate setup.sh generates; the agent refuses plain HTTP
      - "--ssl-key-file"
      - "/run/secrets/llama_ssl_key"
      - "--ssl-cert-file"
      - "/run/secrets/llama_ssl_cert"
    secrets:
      - llama_api_key
      - llama_ssl_key
      - llama_ssl_cert
    ports:
      # Loopback only: the host port is for local tools; the agent uses the network
      - "127.0.0.1:${LLAMA_SERVER_PORT:-8090}:8080"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      # The image ships curl; /health answers once the model is loaded.
      test: ["CMD", "curl", "-f", "--cacert", "/run/secrets/llama_ssl_cert", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      # Only the agent shares this network, so no other container sits on the
      # path that carries prompts and the bearer token, TLS or not.
      - inference

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      # The agent binds 127.0.0.1 by default, which would make the published
      # port unreachable from outside the container.
      - FREEHOLD_HOST=0.0.0.0
      - FREEHOLD_PORT=8082
      - FREEHOLD_CONTEXT_STORE_URL=http://context-store:8081
      - FREEHOLD_ZKP_URL=http://zkp:8084
      - FREEHOLD_CARDANO_URL=${FREEHOLD_CARDANO_URL:-http://host.docker.internal:8080}
      - FREEHOLD_LLM_BACKEND=${FREEHOLD_LLM_BACKEND:-http}
      - FREEHOLD_LLM_URL=${FREEHOLD_LLM_URL:-https://llama-server:8080/v1}
      # llama-server's certificate. For Ollama behind a proxy with a publicly
      # trusted certificate, set FREEHOLD_LLM_CA_FILE= (empty) in .env to use
      # the system store instead.
      - FREEHOLD_LLM_CA_FILE=${FREEHOLD_LLM_CA_FILE-/run/secrets/llama_ssl_cert}
      - FREEHOLD_LLM_TIER=${FREEHOLD_LLM_TIER:-small}
      # Passed through only when set on the host: a served model name for
      # servers that validate names, the bearer token setup.sh wrote, and the
      # rest of the agent's settings (see the table in agent/README.md).
      - FREEHOLD_LLM_MODEL
      - FREEHOLD_LLM_API_KEY
      - FREEHOLD_LLM_TIMEOUT
      - FREEHOLD_APPROVAL_MODE
      - FREEHOLD_CORS_ORIGINS
    secrets:
      - llama_ssl_cert
    depends_on:
      context-store:
        condition: service_healthy
      llama-server:
        # Waits for the model to load when the llm profile is on; absent in
        # Ollama mode. A llama-server that dies later is a dev-stack concern,
        # not something the agent restarts.
        condition: service_healthy
        required: false
    extra_hosts:
      # Lets FREEHOLD_CARDANO_URL reach a Cardano API (e.g. Yaci Store devnet)
      # running on the host, since the stack does not ship one.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freehold-network
      - inference

  # ===========================================
  # Layer 4: ZKP Service
  # ===========================================
  zkp:
    build:
      context: ..
      dockerfile: zkp/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    # NOTE: URL defaults point to local Docker services (require --profile with-midnight
    # or --profile standalone). For remote networks, override these in .env — see
    # configs/example.env for preprod/preview endpoint references.
    # Indexer path is /api/v4/graphql on Ledger 8.1.0 (v3 is still served as an
    # alias for backwards compatibility, but new work should target v4).
    environment:
      - PORT=8084
      - MIDNIGHT_NETWORK=${MIDNIGHT_NETWORK:-preprod}
      - MIDNIGHT_INDEXER_URL=${MIDNIGHT_INDEXER_URL:-http://midnight-indexer:8088/api/v4/graphql}
      - MIDNIGHT_INDEXER_WS_URL=${MIDNIGHT_INDEXER_WS_URL:-ws://midnight-indexer:8088/api/v4/graphql/ws}
      - MIDNIGHT_NODE_URL=${MIDNIGHT_NODE_URL:-http://midnight-node:9944}
      - MIDNIGHT_PROOF_SERVER_URL=${MIDNIGHT_PROOF_SERVER_URL:-http://midnight-proof-server:6300}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      # node, not wget: busybox wget probes IPv4 only and the service
      # listens on IPv6 localhost.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8084/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freehold-network

  # ===========================================
  # Cardano Node (Optional - use profile)
  # Connects to preview testnet
  # ===========================================
  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:10.4.0
    # No published port: topology.json advertises nothing, so the node only dials
    # out to peers. To run a relay that accepts inbound peers, publish 3001 and
    # set advertise: true in the topology.
    volumes:
      - cardano-data:/data
      - cardano-ipc:/ipc
      - ./services/cardano/config:/config:ro
    environment:
      - CARDANO_NODE_SOCKET_PATH=/ipc/node.socket
    command: >
      run
      --topology /config/topology.json
      --database-path /data/db
      --socket-path /ipc/node.socket
      --config /config/config.json
    profiles:
      - cardano-testnet
      - with-nodes
    networks:
      - freehold-network

  # ===========================================
  # Midnight Proof Server
  # Required for ZK proof generation
  # Ledger 8.1.0 (Kūkolu mainnet compatible)
  # https://docs.midnight.network/relnotes/support-matrix
  # NOTE: --network flag was removed in the Ledger 8 line; only -v (verbose)
  # is supported. Leave MIDNIGHT_PROOF_SERVER_FLAGS empty or set to -v.
  # ===========================================
  midnight-proof-server:
    image: midnightntwrk/proof-server:8.1.0
    ports:
      - "127.0.0.1:6300:6300"
    # The image entrypoint is `bash -c`, which only takes the first token of
    # a multi-token command as its script (the rest become $0, $1, ...), so
    # the command must be a single string for flags to survive.
    command: ["midnight-proof-server ${MIDNIGHT_PROOF_SERVER_FLAGS:-}"]
    healthcheck:
      # The image ships bash but no wget/curl, so probe /health over bash's
      # /dev/tcp. /bin/bash by absolute path: the nix PATH is not visible in
      # the healthcheck exec context. $$ keeps compose from interpolating the
      # shell variable.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/6300 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *200* ]]"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freehold-network

  # ===========================================
  # Midnight Standalone (for local testing)
  # Runs node + indexer + proof-server isolated
  # Ledger 8.1.0 images from midnightntwrk registry
  # Compat matrix pins node 1.0.0; 1.0.1 is a binary-only patch on the
  # same line (safe for all networks except Preview, which needs reset).
  # ===========================================
  midnight-node:
    image: midnightntwrk/midnight-node:1.0.1
    ports:
      - "127.0.0.1:9944:9944"
    volumes:
      - midnight-data:/data
    environment:
      - CFG_PRESET=${MIDNIGHT_CFG_PRESET:-dev}
    profiles:
      - with-midnight
      - with-nodes
      - standalone
    networks:
      - freehold-network

  # indexer-standalone bundles its own SQLite storage (no external DB
  # required). The 4.x line replaced the earlier storage/pubsub/ledger_state
  # password knobs with a single APP__INFRA__SECRET (hex-encoded 32 bytes)
  # used to encrypt sensitive data. APP__INFRA__SPO_NODE__BLOCKFROST_ID is
  # required but only exercised for SPO features — a placeholder is fine
  # for local dev.
  # GraphQL API served at /api/v4/graphql (v3 kept as alias for backwards compat).
  midnight-indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - midnight-indexer-data:/data
    environment:
      - APP__APPLICATION__NETWORK_ID=${MIDNIGHT_NETWORK_ID:-undeployed}
      - APP__INFRA__NODE__URL=${MIDNIGHT_INDEXER_NODE_WS:-ws://midnight-node:9944}
      - APP__INFRA__SECRET=${INDEXER_SECRET}
      - APP__INFRA__SPO_NODE__BLOCKFROST_ID=${INDEXER_BLOCKFROST_ID:-placeholder}
    depends_on:
      - midnight-node
    profiles:
      - with-midnight
      - with-nodes
      - standalone
    networks:
      - freehold-network

networks:
  freehold-network:
    driver: bridge
  # The agent's link to llama-server: prompts and the bearer token travel here,
  # under TLS, and nothing else joins it.
  inference:
    driver: bridge

volumes:
  context-data:
  cardano-data:
  cardano-ipc:
  midnight-data:
  midnight-indexer-data:

secrets:
  # Generated by scripts/setup.sh into LLAMA_SECRETS_DIR; secrets/ is gitignored.
  llama_api_key:
    file: ${LLAMA_SECRETS_DIR:-./secrets}/llama-api-key
  llama_ssl_key:
    file: ${LLAMA_SECRETS_DIR:-./secrets}/llama-server.key
  llama_ssl_cert:
    file: ${LLAMA_SECRETS_DIR:-./secrets}/llama-server.crt
