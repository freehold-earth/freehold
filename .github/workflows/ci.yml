name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  aiken:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/spal_validator
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.23
      - run: aiken check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-packages
      - run: uv run ruff check agent spec
      - run: uv run ruff format --check agent spec
      - run: uv run pytest -q
        working-directory: agent
      - run: uv run pytest -q
        working-directory: spec
      - run: uv run ty check .
        working-directory: spec

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - agent/Dockerfile
          - context-store/Dockerfile
          - contracts/Dockerfile
          - zkp/Dockerfile
          - demo/apps/user-app/Dockerfile
          - demo/apps/business-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
