name: Release

# Tags are <component>-v<semver>, e.g. agent-v0.2.0, zkp-v0.3.0.
# npm:    context-store, contracts, identity, zkp (publishes zkp/sdk)
# PyPI:   agent
# Docker: agent, context-store, zkp  ->  peteski22/pci-<component>:<semver>, :latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Component tag to release (e.g. agent-v0.2.0)"
        required: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          case "$TAG" in
            agent-v*|context-store-v*|contracts-v*|identity-v*|zkp-v*) ;;
            *) echo "Tag '$TAG' is not <component>-v<version>"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "component=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

  npm:
    needs: resolve
    if: contains('context-store contracts identity zkp', needs.resolve.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pkg
        run: |
          case "${{ needs.resolve.outputs.component }}" in
            zkp) echo "dir=zkp/sdk" >> "$GITHUB_OUTPUT"; echo "name=@peteski22/pci-zkp-sdk" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dir=${{ needs.resolve.outputs.component }}" >> "$GITHUB_OUTPUT"; echo "name=@peteski22/pci-${{ needs.resolve.outputs.component }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: pnpm --filter ${{ steps.pkg.outputs.name }} build
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: resolve
    if: needs.resolve.outputs.component == 'agent'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: astral-sh/setup-uv@v4
      - run: uv build --package freehold-agent
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: resolve
    if: contains('agent context-store zkp', needs.resolve.outputs.component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ needs.resolve.outputs.component }}/Dockerfile
          push: true
          tags: |
            peteski22/pci-${{ needs.resolve.outputs.component }}:${{ needs.resolve.outputs.version }}
            peteski22/pci-${{ needs.resolve.outputs.component }}:latest
