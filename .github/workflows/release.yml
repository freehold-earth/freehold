name: Release

# Tags are <component>-v<semver>, e.g. agent-v0.2.0, zkp-v0.3.0.
# npm:    context-store, contracts, identity, zkp (publishes zkp/sdk) via trusted publishing (OIDC)
# PyPI:   agent (freehold-agent), spec (freehold-preimage); publish spec before agent,
#         because freehold-agent pins freehold-preimage to the matching minor and the
#         agent publish refuses to run until that pin resolves on PyPI
# Docker: agent, context-store, zkp  ->  ghcr.io/freehold-earth/<component>:<semver>, :latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Component tag to release (e.g. agent-v0.2.0)"
        required: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          case "$TAG" in
            agent-v*|spec-v*|context-store-v*|contracts-v*|identity-v*|zkp-v*) ;;
            *) echo "Tag '$TAG' is not <component>-v<version>"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "component=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"

  npm:
    needs: resolve
    if: contains('context-store contracts identity zkp', needs.resolve.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pkg
        run: |
          case "${{ needs.resolve.outputs.component }}" in
            zkp) echo "dir=zkp/sdk" >> "$GITHUB_OUTPUT"; echo "name=@freehold-earth/zkp-sdk" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dir=${{ needs.resolve.outputs.component }}" >> "$GITHUB_OUTPUT"; echo "name=@freehold-earth/${{ needs.resolve.outputs.component }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: pnpm --filter ${{ steps.pkg.outputs.name }} build
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22's bundled npm is older.
      - run: npm install -g npm@11 && npm --version
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}

  pypi:
    needs: resolve
    if: contains('agent spec', needs.resolve.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: pkg
        run: |
          case "${{ needs.resolve.outputs.component }}" in
            agent) echo "name=freehold-agent" >> "$GITHUB_OUTPUT" ;;
            spec)  echo "name=freehold-preimage" >> "$GITHUB_OUTPUT" ;;
          esac
      # The agent pins freehold-preimage to its minor. Refuse to publish an agent
      # whose pin nothing on PyPI satisfies yet: spec-v<version> goes first.
      - if: needs.resolve.outputs.component == 'agent'
        run: |
          python3 - > preimage-pin.txt <<'PY'
          import tomllib
          project = tomllib.load(open("agent/pyproject.toml", "rb"))["project"]
          print(next(dep for dep in project["dependencies"] if dep.startswith("freehold-preimage")))
          PY
          cat preimage-pin.txt
          uv pip compile --no-cache preimage-pin.txt
      - run: uv build --package ${{ steps.pkg.outputs.name }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker:
    needs: resolve
    if: contains('agent context-store zkp', needs.resolve.outputs.component)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/freehold-earth/${{ needs.resolve.outputs.component }}:${{ needs.resolve.outputs.version }}
            ghcr.io/freehold-earth/${{ needs.resolve.outputs.component }}:latest
