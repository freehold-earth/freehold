version: 2
# Version updates run monthly. Security updates are not scheduled and still
# open as soon as an advisory lands.
updates:
  # Every action in .github/workflows is pinned to a commit SHA, with the
  # release it stands for in a trailing comment. A pinned SHA cannot be moved
  # under us, and it also never moves on its own, so without this the pins go
  # stale and miss upstream security patches. Dependabot bumps both the SHA
  # and the comment as new releases ship.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      # Conventional Commits, as every other commit and pull request title here.
      prefix: "ci"
      include: "scope"
    groups:
      # One pull request a month for routine minor and patch bumps; a major
      # bump still arrives on its own so it gets a proper look.
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # The Go module at the repository root. Same rhythm as the actions above:
  # one grouped pull request a month, a major bump on its own.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-modules:
        update-types:
          - "minor"
          - "patch"
