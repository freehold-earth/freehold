# Default runtime (ADR-006):  COMPOSE_PROFILES=llm docker compose up
# Ollama on the host:         FREEHOLD_LLM_BACKEND=ollama docker compose up
# The infra/ stack is the same shape with the rest of the services.
services:
  # llama-server over one GGUF file from MODELS_DIR. The agent image carries no
  # model loader, so the model is served, not mounted into the agent.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-b12063
    profiles:
      - llm
    command:
      - "-m"
      - "/models/${MODEL_FILE:-Phi-3-mini-4k-instruct-q4.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLM_CONTEXT_LENGTH:-4096}"
      - "--no-slots"
    ports:
      - "127.0.0.1:${LLAMA_SERVER_PORT:-8090}:8080"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  agent:
    build: .
    ports:
      # Publish to host loopback only: the coordination API is unauthenticated
      # (auth lands in Phase 2). Widen this deliberately behind auth + TLS.
      - "127.0.0.1:8082:8082"
    environment:
      - CONTEXT_STORE_URL=http://context-store:8081
      - FREEHOLD_LLM_BACKEND=${FREEHOLD_LLM_BACKEND:-openai}
      - FREEHOLD_OPENAI_BASE_URL=${FREEHOLD_OPENAI_BASE_URL:-http://llama-server:8080/v1}
      # Passed through only when set on the host: a served model name for
      # servers that validate names, and a bearer token if the server needs one.
      - FREEHOLD_OPENAI_MODEL
      - FREEHOLD_OPENAI_API_KEY
      - FREEHOLD_OLLAMA_URL=${FREEHOLD_OLLAMA_URL:-http://host.docker.internal:11434}
      - FREEHOLD_LLM_TIER=${FREEHOLD_LLM_TIER:-small}
      - PORT=8082
      # Bind all container interfaces so the published port reaches the app;
      # host exposure is constrained by the loopback port mapping above.
      - HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llama-server:
        condition: service_healthy
        required: false  # absent when the llm profile is off (Ollama mode)

  # Optional: standalone context store for local dev
  context-store:
    image: ghcr.io/freehold-earth/context-store:latest
    ports:
      - "8081:8081"
    profiles:
      - with-deps
