# Midnight Network - Local Development Stack (Ledger 8.1.0)
# Run: docker compose up -d
#
# This starts a local Midnight network for ZK proof generation and verification.
# Aligned with infra's Ledger 8.1.0 refresh (proof-server 8.1.0,
# midnight-node 1.0.1, indexer-standalone 4.3.3, /api/v4/graphql).

services:
  # Midnight blockchain node
  node:
    image: midnightntwrk/midnight-node:1.0.1
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Proof server - generates ZK proofs locally.
  # NB: the --network flag was removed in the Ledger 8 line; -v is the only flag.
  # The image carries no shell or curl, so it has no container healthcheck;
  # readiness is GET /health from outside.
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    ports:
      - "6300:6300"
    command: ["midnight-proof-server"]
    environment:
      RUST_BACKTRACE: full

  # Indexer - queries blockchain state.
  # indexer-standalone 4.x is single-binary + SQLite: the storage/pubsub/ledger
  # passwords from 3.x are gone; a single APP__INFRA__SECRET (hex-32-bytes) and
  # APP__INFRA__SPO_NODE__BLOCKFROST_ID (placeholder OK for local dev) are now
  # required. Serves both /api/v3/graphql (backwards-compat alias) and
  # /api/v4/graphql (canonical for Ledger 8).
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    ports:
      - "8088:8088"
    environment:
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__SECRET: "3031323334353637383930313233343536373839303132333435363738393031"
      APP__INFRA__NODE__URL: "ws://node:9944"
      # The SPO sub-indexer defaults to ws://localhost:9944, which inside the
      # container is nothing, and its failure takes the whole indexer down.
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "placeholder"
      RUST_LOG: "indexer=debug,chain_indexer=debug,indexer_api=debug"
    volumes:
      - indexer-data:/data
    healthcheck:
      # The entrypoint keeps this marker for as long as the indexer runs
      test: ["CMD", "cat", "/var/run/indexer-standalone/running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      node:
        condition: service_healthy

  # Freehold ZKP Service - our TypeScript SDK wrapper. The image is built
  # from the repository root, as in CI, because the Dockerfile installs the
  # pnpm workspace.
  zkp:
    build:
      context: ..
      dockerfile: zkp/Dockerfile
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      MIDNIGHT_NODE_URL: "ws://node:9944"
      MIDNIGHT_PROOF_SERVER_URL: "http://proof-server:6300"
      MIDNIGHT_INDEXER_URL: "http://indexer:8088"
    depends_on:
      node:
        condition: service_healthy
      proof-server:
        condition: service_started
      indexer:
        condition: service_healthy

volumes:
  indexer-data:

networks:
  default:
    name: freehold-midnight
